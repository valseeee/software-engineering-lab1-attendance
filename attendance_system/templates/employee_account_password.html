{% extends "employee_layout.html" %}

{% block title %}修改密码{% endblock %}

{% block employee_content %}
<div class="hero-card">
    <div class="card-body p-4 p-md-5">
        <div class="page-kicker">账号安全</div>
        <h1 class="page-title">修改登录密码</h1>
        <p class="page-subtitle">先验证当前密码，再设置新的登录密码。成功后下次登录会立即生效。</p>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-xl-8">
        <div class="panel-card form-card">
            <div class="card-body p-4 p-md-5">
                <form method="post" class="row g-3">
                    <div class="col-12">
                        <label class="form-label" for="old_password">原密码</label>
                        <input class="form-control" id="old_password" name="old_password" type="password" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="new_password">新密码</label>
                        <input class="form-control" id="new_password" name="new_password" type="password" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="confirm_password">确认新密码</label>
                        <input class="form-control" id="confirm_password" name="confirm_password" type="password" required>
                    </div>
                    <div class="col-12">
                        <div class="helper-note">后端仍会校验原密码、新密码是否为空，以及两次输入是否一致。</div>
                    </div>
                    <div class="col-12 d-flex gap-2 flex-wrap">
                        <button class="btn btn-primary rounded-pill px-4" type="submit">保存新密码</button>
                        <span class="helper-note align-self-center">保存成功后，下次登录将使用新密码。</span>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
